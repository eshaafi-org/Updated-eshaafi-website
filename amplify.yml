version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm install 20.11.0
            - nvm use 20.11.0
            - node -v
            - npm ci --legacy-peer-deps
        build:
          commands:
            - npm run build
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
     
